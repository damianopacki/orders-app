@if (pageStatus() !== 'loading' && pageStatus() !== 'error') {
  <button type="button" class="orders-page__add-button" (click)="addOrderDialog.open()">Dodaj zlecenie</button>
  <app-add-order-dialog
    #addOrderDialog
    [availableSymbols]="ordersStore.availableSymbols()"
    [quotesBySymbol]="quotesStore.quotes()"
    (submitted)="addOrder($event)"
  />
}

@switch (pageStatus()) {
  @case ('loading') {
    <p class="orders-page__status">Ładowanie danych…</p>
  }
  @case ('error') {
    <p class="orders-page__status" role="alert">Nie udało się załadować danych. Spróbuj odświeżyć stronę.</p>
  }
  @case ('empty') {
    <p class="orders-page__status">Brak zleceń do wyświetlenia.</p>
  }
  @default {
    <app-orders-table
      [groups]="groups()"
      (toggleGroup)="ordersStore.toggleGroup($event)"
      (closeOrder)="closeOrder($event)"
      (closeGroup)="closeGroup($event)"
    />
  }
}
