<!--
  Click-outside-to-close on the backdrop is mouse-only by nature — Escape already closes
  the dialog natively (built into <dialog>), so it's not missing a keyboard path, just
  triggering the a11y linter's generic click-needs-keydown/focusable heuristic.
-->
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<dialog
  #dialog
  class="add-order-dialog"
  aria-labelledby="add-order-dialog-title"
  (click)="onBackdropClick($event)"
>
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
  <div class="add-order-dialog__panel" (click)="$event.stopPropagation()">
    <div class="add-order-dialog__header">
      <h2 id="add-order-dialog-title">Dodaj zlecenie</h2>
      <button type="button" class="add-order-dialog__close" aria-label="Zamknij" (click)="close()">
        &times;
      </button>
    </div>

    <app-add-order-form
      [availableSymbols]="availableSymbols()"
      [quotesBySymbol]="quotesBySymbol()"
      (submitted)="onSubmitted($event)"
    />
  </div>
</dialog>
