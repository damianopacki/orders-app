<td></td>
<td>{{ row().order.id }}</td>
<td>{{ row().order.side }}</td>
<td>{{ row().order.size | number: quantityFormat }}</td>
<td>{{ row().order.openTime | date: timeFormat }}</td>
<td>{{ row().order.openPrice | number: priceFormat }}</td>
<td>{{ row().order.swap | number: amountFormat }}</td>
<td
  class="order-row__profit"
  [class.order-row__profit--positive]="profitModifier() === 'positive'"
  [class.order-row__profit--negative]="profitModifier() === 'negative'"
  [attr.title]="row().profit === null ? profitUnavailableTitle : null"
>
  {{ (row().profit | number: amountFormat) ?? profitPlaceholder }}
</td>
<td>
  <button
    type="button"
    class="order-row__close"
    [attr.aria-label]="'Zamknij zlecenie nr ' + row().order.id"
    title="Usuń"
    (click)="closed.emit()"
  >
    <app-trash-icon />
  </button>
</td>
